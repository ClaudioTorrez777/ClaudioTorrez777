<svg viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .base {
      font-family: 'Courier New', Consolas, monospace;
      font-weight: 700;
      font-size: 42px;
      letter-spacing: 2px;
    }
    .layer-cyan {
      fill: #00fff2;
      mix-blend-mode: screen;
      animation: glitch-cyan 2.6s infinite steps(2, end);
    }
    .layer-magenta {
      fill: #ff00c8;
      mix-blend-mode: screen;
      animation: glitch-magenta 3.1s infinite steps(2, end);
    }
    .layer-base {
      fill: #eafcff;
      animation: glitch-flicker 4.4s infinite steps(1, end);
    }
    @keyframes glitch-cyan {
      0%, 100% { transform: translate(0, 0); opacity: 1; }
      12%      { transform: translate(-4px, 2px); }
      24%      { transform: translate(3px, -2px); }
      36%      { transform: translate(-2px, 1px); opacity: 0.6; }
      48%      { transform: translate(0, 0); }
      70%      { transform: translate(4px, 1px); }
      82%      { transform: translate(-3px, -1px); }
    }
    @keyframes glitch-magenta {
      0%, 100% { transform: translate(0, 0); opacity: 1; }
      15%      { transform: translate(4px, -2px); }
      30%      { transform: translate(-3px, 2px); }
      45%      { transform: translate(2px, -1px); opacity: 0.6; }
      60%      { transform: translate(0, 0); }
      75%      { transform: translate(-4px, 1px); }
      88%      { transform: translate(3px, -1px); }
    }
    @keyframes glitch-flicker {
      0%, 89%, 100% { opacity: 1; }
      90%  { opacity: 0.3; }
      91%  { opacity: 1; }
      92%  { opacity: 0.2; transform: translate(2px,0); }
      93%  { opacity: 1; transform: translate(0,0); }
    }
  </style>

  <text x="450" y="65" text-anchor="middle" class="base layer-cyan">CLAUDIO_TORREZ_DE_PAZ</text>
  <text x="450" y="65" text-anchor="middle" class="base layer-magenta">CLAUDIO_TORREZ_DE_PAZ</text>
  <text x="450" y="65" text-anchor="middle" class="base layer-base">CLAUDIO_TORREZ_DE_PAZ</text>
</svg>
